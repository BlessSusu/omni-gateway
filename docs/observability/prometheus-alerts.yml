groups:
  - name: omni-gateway
    rules:
      - alert: OmniSniffFailureRateHigh
        expr: rate(omni_sniff_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sniff failure rate elevated"
      - alert: OmniDownlinkSkipNotLocal
        expr: rate(omni_downlink_skip_not_local_total[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Downlink skip-not-local (check Phase2 per-node topics)"
      - alert: OmniKafkaPublishP99High
        expr: histogram_quantile(0.99, rate(omni_kafka_publish_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka uplink publish P99 high"
