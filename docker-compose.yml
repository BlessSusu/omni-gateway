# 本地开发用 Kafka（KRaft 单节点，无需 ZooKeeper）
# 启动：docker compose up -d
# 停止：docker compose down
#
# 远程访问时务必设置对外地址（与 omni.kafka.bootstrap-servers 一致）：
#   $env:KAFKA_ADVERTISED_HOST="42.192.55.235"
#   docker compose up -d
# 否则客户端 bootstrap 能连上，但元数据会返回 localhost:9092 导致连接失败。

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: omni-kafka
    hostname: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 容器内监听 9092，映射到宿主机 19092；advertised 必须是客户端实际访问的 host:port
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4rKr7NsISjGt966RazG5xg"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
