server:
  port: 8080

spring:
  application:
    name: omni-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info,omniconfig,omnidrain,omnilisteners
  endpoint:
    omniconfig:
      enabled: true
    omnidrain:
      enabled: true
    omnilisteners:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

omni:
  node-id: ${HOSTNAME:local}-${server.port}
  gateway:
    config-version: 1
    reader-idle-seconds: 120
    kick-old-on-reauth: true
    listeners:
      - port: 9000
        plugins:
          - jt808
          - simple-frame
        plugin-priority:
          - jt808
          - simple-frame
        sniff:
          max-bytes: 256
          timeout-ms: 5000
          min-probe-length: 1
      - port: 9001
        plugins:
          - jt808
        plugin-priority:
          - jt808
        sniff:
          max-bytes: 512
          timeout-ms: 5000
          min-probe-length: 1
  security:
    connection-rate-per-ip: 50
    ip-deny-list: []
    ip-allow-list: []
  backpressure:
    max-global-pending: 5000
    max-per-channel-pending: 32
  config:
    external-file: ""
    poll-interval-ms: 30000
  kafka:
    enabled: true
    bootstrap-servers: 42.192.55.235:19092
    uplink-topic: omni.device.uplink
    lifecycle-topic: omni.device.lifecycle
    lifecycle-enabled: true
    failure-threshold: 3
  session:
    redis-enabled: true
    redis-ttl-seconds: 0
  downlink:
    enabled: true
    topic: omni.command.downlink
    node-topic-pattern: "omni.command.downlink.{nodeId}"
    router-enabled: false
    result-topic: omni.command.downlink.result
    result-enabled: true
    consumer-group: omni-gateway-downlink
  tls:
    enabled: false
    mtls-enabled: false
    cert-path: classpath:certs/server.pem
    key-path: classpath:certs/server-key.pem
    trust-cert-path: classpath:certs/ca.pem
  observability:
    trace-enabled: true
  logging:
    json-enabled: true
    # 完整协议帧十六进制流量日志（类似 SESSION/SN recv|send）；生产建议 false
    protocol-hex-enabled: true

logging:
  level:
    com.omni.gateway: INFO
    root: INFO
